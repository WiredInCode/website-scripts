<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2FA QR Code Decoder</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

  <style>
    #preview {
      max-width: 300px;
      margin-top: 15px;
      display: none;
    }
    pre {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
    }
    #copySuccess {
      display: none;
    }
  </style>
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">2FA QR Code Decoder</h4>
        </div>
        <div class="card-body">

          <p>Select your QR code image below. Everything is processed locally in your browser.</p>

          <input type="file" id="fileInput" class="form-control" accept="image/*">

          <img id="preview" class="img-thumbnail">

          <div class="mt-4">
            <h6>Status:</h6>
            <div id="status" class="text-muted">Waiting for file...</div>
          </div>

          <div class="mt-3">
            <h6 class="d-flex align-items-center">
              TOTP Secret
              <button id="copyBtn" class="btn btn-sm btn-outline-secondary ms-3" disabled>
                Copy
              </button>
              <span id="copySuccess" class="badge bg-success ms-2">Copied!</span>
            </h6>

            <pre id="secret">(none yet)</pre>
          </div>

        </div>
      </div>

      <canvas id="canvas" style="display:none;"></canvas>

    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
// COPY BUTTON HANDLER
document.getElementById("copyBtn").addEventListener("click", () => {
  const secretText = document.getElementById("secret").innerText.trim();
  navigator.clipboard.writeText(secretText).then(() => {
    const badge = document.getElementById("copySuccess");
    badge.style.display = "inline";

    setTimeout(() => {
      badge.style.display = "none";
    }, 1500);
  });
});

// QR Decode Handler
document.getElementById("fileInput").addEventListener("change", function(evt) {
  const file = evt.target.files[0];
  if (!file) return;

  const img = new Image();
  const reader = new FileReader();

  reader.onload = function(e) {
    img.onload = function() {
      // Show preview image
      const preview = document.getElementById("preview");
      preview.src = img.src;
      preview.style.display = 'block';

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, canvas.width, canvas.height);

      if (!code) {
        document.getElementById("status").innerHTML =
          '<span class="text-danger">No QR code detected.</span>';
        
        document.getElementById("copyBtn").disabled = true;
        return;
      }

      document.getElementById("status").innerHTML =
        '<span class="text-success">QR code detected.</span>';

      const uri = code.data;

      // Parse otpauth:// URI
      let secret = "(no secret parameter)";
      try {
        const url = new URL(uri);
        secret = url.searchParams.get("secret") || secret;
      } catch {
        secret = "Invalid otpauth URI";
      }

      document.getElementById("secret").innerText = secret;

      // Enable copy button if valid
      document.getElementById("copyBtn").disabled = (secret === "(no secret parameter)");
    };
    img.src = e.target.result;
  };

  reader.readAsDataURL(file);
});
</script>

</body>
</html>
